<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1a1c">
<title>Terrarium Drift</title>
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand"><span class="logo" aria-hidden="true"></span><b>Terrarium Drift</b></div>
    <div class="stats">
      <div class="chip big" title="Stability: the currency your jar produces"><span class="ico">✦</span><span id="v-stab">0</span><small id="v-rate"></small></div>
      <div class="chip" title="Rare seeds"><span class="ico seed">◆</span><span id="v-seeds">0</span></div>
      <div class="meter" title="Harmony: how well the plants are doing"><label>Harmony</label><div class="bar"><i id="b-harm"></i></div><span id="v-harm"></span></div>
      <div class="meter strain" title="Strain: at 100% the jar collapses"><label>Strain</label><div class="bar"><i id="b-strain"></i></div><span id="v-strain"></span></div>
      <div class="chip calm" title="Calm: time since you last disturbed the jar. Long calm lets rare morphs and symbioses appear."><span class="ico">☾</span><span id="v-calm"></span></div>
    </div>
  </header>
  <main>
    <section id="stage">
      <div class="jarwrap">
        <canvas id="jar" aria-label="Terrarium"></canvas>
        <div id="toolhint" class="toolhint" hidden></div>
        <div id="toasts"></div>
        <div id="selcard" class="selcard" hidden></div>
      </div>
      <div id="logline" class="logline"></div>
    </section>
    <section id="panel">
      <nav id="tabs" role="tablist"></nav>
      <div id="tabbody"></div>
    </section>
  </main>
  <div id="modal" class="modal" hidden></div>
</div>
<noscript>Terrarium Drift needs JavaScript.</noscript>
<script src="src/data.js"></script>
<script src="src/sim.js"></script>
<script src="src/plants.js"></script>
<script src="src/render.js"></script>
<script src="src/ui.js"></script>
</body>
</html>
